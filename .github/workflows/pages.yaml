name: pages

# Build every score's PDF and publish them to GitHub Pages, together with a
# simple auto-generated index page grouped by composer.
#
# Runs only on tagged releases (matching the project's own release cadence,
# see CHANGELOG.md) and on manual dispatch, rather than on every push: a full
# `make` rebuilds the whole collection (100+ pieces, some 100+ pages each),
# which is too expensive to repeat on every commit.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment, but don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: 'fedora:44'

    steps:
      - uses: actions/checkout@v2

      - id: install_deps
        run: |
          dnf -y update
          dnf -y install autoconf automake bzip2 findutils gawk git lilypond make xz
          # The checkout is owned by a different uid than the container runs
          # as, which makes git refuse to operate on it ("detected dubious
          # ownership") -- the collect step below relies on `git ls-files`,
          # so without this every piece is silently skipped (the script
          # never checks git's exit code, so the step still "succeeds"
          # while producing an empty manifest).
          git config --global --add safe.directory '*'

      - id: configure
        run: |
          autoreconf --install
          ./configure

      - id: make
        run: |
          make

      - id: collect
        env:
          # The checkout is bind-mounted into the container, which git's
          # repository-discovery walk treats as a filesystem boundary it
          # refuses to cross by default ("not a git repository ...
          # Stopping at filesystem boundary") -- without this, `git
          # ls-files` fails for every directory, and since the script
          # never checked its exit code, every piece was silently skipped
          # while the step still reported success (now caught loudly by
          # the empty-manifest check below instead).
          GIT_DISCOVERY_ACROSS_FILESYSTEM: 1
        run: |
          # Only each piece's main assembled PDF, derived from the actual
          # build target named in that directory's Makefile.am (every one
          # of them reads "all: $(BUILT_SOURCES) <TargetName>" and builds
          # exactly <TargetName>.pdf -- verified against every Makefile.am
          # in the tree). This is the authoritative source, rather than
          # just collecting every *.pdf found on disk, which would also
          # pick up: stray lilypond-tmp-* ghostscript leftovers; individual
          # movement fragments under parts/; per-piece PDFs left behind in
          # a subdirectory that is actually folded into a parent
          # collection's single merged PDF (e.g. Liszt's "Late Works",
          # where each movement's own directory has no Makefile.am of its
          # own); and unrelated stale PDFs (e.g. an old index.pdf) sitting
          # alongside the real target in the same directory.
          # It also skips any piece whose directory has no file committed
          # to git (a real CI checkout never has these, but a local
          # dry-run against a working tree with in-progress/uncommitted
          # pieces would).
          # Also record, per PDF, the composer's top-level directory name,
          # the PDF's path relative to _site, and the human-readable
          # "title"/"opus"/"source" fields from that piece's own header.ily
          # (every target directory has one, each with a quoted title --
          # verified against the whole tree), for the index page to use
          # instead of the raw filename. "source" is only used as a last
          # resort, to tell apart two pieces that legitimately share both
          # title and opus (e.g. two different pianists' transcriptions of
          # the same Bach chorale).
          mkdir -p _site
          : > /tmp/pages-manifest.tsv
          find src -name Makefile.am -print0 |
            while IFS= read -r -d '' makefile; do
              dir="$(dirname "$makefile")"
              [ -n "$(git ls-files -- "$dir")" ] || continue
              target="$(sed -n 's/^all: \$(BUILT_SOURCES) //p' "$makefile" | head -1)"
              [ -n "$target" ] || continue
              pdf="$dir/$target.pdf"
              [ -f "$pdf" ] || continue
              dest="_site/${pdf#src/}"
              mkdir -p "$(dirname "$dest")"
              cp "$pdf" "$dest"

              composer_dir="$(echo "${dir#src/}" | cut -d/ -f1)"
              title="$(sed -n 's/^[[:space:]]*title[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/header.ily" | head -1)"
              opus="$(sed -n 's/^[[:space:]]*opus[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/header.ily" | head -1)"
              source_field="$(sed -n 's/^[[:space:]]*source[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$dir/header.ily" | head -1)"
              [ -n "$title" ] || title="$target"
              printf '%s\t%s\t%s\t%s\t%s\n' "$composer_dir" "${pdf#src/}" "$title" "$opus" "$source_field" \
                >> /tmp/pages-manifest.tsv
            done
          cp images/open-scores-logo.png _site/

          # Fail loudly rather than silently deploying an empty page: this
          # is what would have caught the git/safe.directory issue above
          # instead of it shipping unnoticed (the workflow still reported
          # "success" with zero pieces collected).
          collected="$(wc -l < /tmp/pages-manifest.tsv)"
          echo "collected $collected pieces"
          if [ "$collected" -lt 1 ]; then
            echo "::error::pages-manifest.tsv is empty -- collected 0 pieces, refusing to deploy an empty index" >&2
            exit 1
          fi

      - id: index
        run: |
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Open Scores for Piano</title>'
            cat <<'CSS'
          <style>
            :root {
              color-scheme: light dark;
              --fg: #1a1a1a;
              --bg: #ffffff;
              --muted: #666666;
              --accent: #6a3fa0;
              --border: #e0e0e0;
              --card-bg: #f8f6fb;
              --zebra: rgba(106, 63, 160, 0.05);
            }
            @media (prefers-color-scheme: dark) {
              :root {
                --fg: #e8e8e8;
                --bg: #181818;
                --muted: #a0a0a0;
                --accent: #b090e0;
                --border: #333333;
                --card-bg: #201e26;
                --zebra: rgba(176, 144, 224, 0.07);
              }
            }
            body {
              font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
              color: var(--fg);
              background: var(--bg);
              max-width: 46rem;
              margin: 2rem auto;
              padding: 0 1.5rem 4rem;
              line-height: 1.5;
            }
            header {
              text-align: center;
              margin-bottom: 1.5rem;
            }
            header img.logo {
              max-width: 100%;
              height: auto;
            }
            .badges {
              display: flex;
              flex-wrap: wrap;
              justify-content: center;
              gap: 0.4rem;
              margin: 0.9rem 0 0;
            }
            .badges img {
              height: 20px;
            }
            h1 {
              font-size: 1.5rem;
              margin: 1.2rem 0 0.3rem;
            }
            .tagline {
              margin: 0 0 0.9rem;
            }
            .blurb {
              font-style: italic;
              color: var(--muted);
              font-size: 0.9rem;
              max-width: 40rem;
              margin: 0 auto;
              padding-bottom: 1rem;
              border-bottom: 2px solid var(--accent);
            }
            .alpha-nav {
              display: flex;
              flex-wrap: wrap;
              justify-content: center;
              gap: 0.5rem;
              margin: 1.8rem 0 0.5rem;
              font-weight: bold;
              font-size: 0.85rem;
            }
            .alpha-nav a {
              color: var(--accent);
            }
            .alpha-nav span {
              color: var(--border);
            }
            section.composer {
              background: var(--card-bg);
              border: 1px solid var(--border);
              border-radius: 0.6rem;
              padding: 0.9rem 1.1rem 0.5rem;
              margin: 1.1rem 0;
            }
            h2 {
              font-size: 1.2rem;
              margin: 0 0 0.2rem;
              color: var(--accent);
            }
            table {
              width: 100%;
              table-layout: fixed;
              border-collapse: collapse;
              margin: 0.5rem 0 0;
            }
            td {
              padding: 0.3rem 0.4rem;
              vertical-align: middle;
              overflow-wrap: break-word;
            }
            tr {
              border-bottom: 1px solid var(--border);
            }
            tr:last-child {
              border-bottom: none;
            }
            tr.even {
              background: var(--zebra);
            }
            td.icon-col {
              width: 2.2rem;
              text-align: center;
              white-space: nowrap;
            }
            a {
              color: var(--fg);
              text-decoration: none;
            }
            a:hover {
              color: var(--accent);
              text-decoration: underline;
            }
            a.icon {
              text-decoration: none;
              filter: grayscale(40%);
            }
            a.icon:hover {
              text-decoration: none;
              filter: none;
            }
          </style>
          CSS
            echo '</head><body>'
            # Same header as the project's own README.md: logo, badges,
            # title, tagline, and the LilyPond blurb.
            cat <<'HEADER'
          <header>
            <img class="logo" src="open-scores-logo.png" alt="Open Scores for Piano">
            <p class="badges">
              <img alt="Release Status" src="https://img.shields.io/badge/status-in--progress-brightgreen.svg">
              <a href="https://spdx.org/licenses/CC-BY-NC-SA-4.0.html"><img alt="License" src="https://img.shields.io/badge/License-CC--BY--NC--SA--4.0-blue.svg"></a>
              <a href="https://github.com/madrisan/open-scores/releases"><img alt="Latest Release" src="https://img.shields.io/badge/download-latest--version-blue.svg"></a>
              <img alt="GitHub All Releases" src="https://img.shields.io/github/downloads/madrisan/open-scores/total.svg?style=flat-square">
            </p>
            <h1>Open Scores for Piano encoded using LilyPond</h1>
            <p class="tagline"><strong>Piano sheet music and piano transcriptions with source code in LilyPond language</strong></p>
            <p class="blurb">
              <a href="https://lilypond.org/">LilyPond</a> is a music engraving program, devoted to producing the
              highest-quality sheet music possible. It brings the aesthetics of traditionally engraved music to
              computer printouts. LilyPond is free software and part of the
              <a href="https://gnu.org/">GNU Project</a>.
            </p>
          </header>
          HEADER
            # Group by composer (sorted), each piece titled from its own
            # header.ily, in tiers:
            #  1. plain title (e.g. Chorale Prelude - ...)
            #  2. + opus/catalogue number, whenever header.ily has one that
            #     isn't already spelled out in the title itself (e.g.
            #     Domenico Scarlatti's sonatas are all just "Sonata" in
            #     their header.ily, but "Deux contrastes Op. 31" already
            #     names its own opus, so nothing is appended there)
            #  3. + arranger, parsed out of "source", only for entries that
            #     still collide after tier 2 (e.g. two different pianists'
            #     transcriptions of the very same Bach chorale, sharing
            #     both title and opus) -- falls back to the piece's own
            #     directory name if "source" doesn't name one.
            # Each entry also gets two small icon links: 🎼 to the built
            # PDF, 📂 to that piece's own source directory on GitHub (main
            # branch).
            repo_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-madrisan/open-scores}"
            sort -t "$(printf '\t')" -k1,1 -k2,2 /tmp/pages-manifest.tsv |
              gawk -F '\t' -v repo_url="$repo_url" '
                {
                  composer[NR] = $1; relpath[NR] = $2
                  title[NR] = $3; opus[NR] = $4; source_field[NR] = $5
                  n = NR
                }
                function esc(s) {
                  gsub(/&/, "\\&amp;", s)
                  gsub(/</, "\\&lt;", s)
                  gsub(/>/, "\\&gt;", s)
                  return s
                }
                function display_composer(dir,    parts, k, w, out) {
                  n_parts = split(dir, parts, "-")
                  out = ""
                  for (k = 1; k <= n_parts; k++) {
                    w = parts[k]
                    w = toupper(substr(w, 1, 1)) substr(w, 2)
                    if (w == "Van" || w == "Von") w = tolower(w)
                    out = out (out == "" ? "" : " ") w
                  }
                  return out
                }
                function piece_dirname(rel,    d) {
                  d = rel
                  sub(/\/[^\/]*$/, "", d)
                  sub(/^.*\//, "", d)
                  return d
                }
                function piece_full_dir(rel,    d) {
                  d = rel
                  sub(/\/[^\/]*$/, "", d)
                  return d
                }
                END {
                  for (i = 1; i <= n; i++) {
                    t2 = title[i]
                    o = opus[i]
                    if (o != "" && o != "-" && o != "N/A" &&
                        index(tolower(title[i]), tolower(o)) == 0)
                      t2 = t2 " (" o ")"
                    tier2[i] = t2
                    count2[composer[i] SUBSEP t2]++
                  }

                  # Quick A-Z nav: composer dirs are sorted, and the first
                  # character of a composer dir always matches the first
                  # character of its display name (display_composer only
                  # capitalizes, never reorders) -- so the first composer
                  # seen for each letter is already the right jump target.
                  n_letters = split("ABCDEFGHIJKLMNOPQRSTUVWXYZ", letters, "")
                  for (i = 1; i <= n; i++) {
                    L = toupper(substr(composer[i], 1, 1))
                    if (!(L in first_dir)) first_dir[L] = composer[i]
                  }
                  print "<nav class=\"alpha-nav\">"
                  for (li = 1; li <= n_letters; li++) {
                    L = letters[li]
                    if (L in first_dir)
                      printf "<a href=\"#%s\">%s</a>\n", esc(first_dir[L]), L
                    else
                      printf "<span>%s</span>\n", L
                  }
                  print "</nav>"

                  cur = ""
                  for (i = 1; i <= n; i++) {
                    if (composer[i] != cur) {
                      if (cur != "") print "</table></section>"
                      printf "<section class=\"composer\" id=\"%s\">\n", esc(composer[i])
                      print "<h2>" esc(display_composer(composer[i])) "</h2>"
                      print "<table>"
                      cur = composer[i]
                      row = 0
                    }
                    t = tier2[i]
                    if (count2[composer[i] SUBSEP t] > 1) {
                      who = source_field[i]
                      if (!sub(/^.*[Bb]y /, "", who)) who = piece_dirname(relpath[i])
                      t = t " — " who
                    }
                    source_url = repo_url "/tree/main/src/" piece_full_dir(relpath[i])
                    row++
                    printf "<tr%s><td>%s</td>" \
                           "<td class=\"icon-col\"><a class=\"icon\" href=\"%s\" title=\"View the PDF\">🎼</a></td>" \
                           "<td class=\"icon-col\"><a class=\"icon\" href=\"%s\" title=\"View the source on GitHub\">📂</a></td></tr>\n", \
                           (row % 2 == 0 ? " class=\"even\"" : ""), esc(t), esc(relpath[i]), esc(source_url)
                  }
                  if (cur != "") print "</table></section>"
                }
              '
            echo '</body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
