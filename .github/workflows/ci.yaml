name: ci

on:
  push:
    paths-ignore:
      - '**.md'
      - AUTHORS
      - VERSION
      - lyinit/**/*
  pull_request:
    types: [assigned, edited, opened, synchronize, reopened]

jobs:
  build-checks:
    runs-on: ubuntu-latest
    container: 'fedora:44'

    steps:
      # git and git-lfs must be installed before actions/checkout runs:
      # without git it falls back to a plain tarball download, which only
      # contains the LFS pointer stubs instead of the .eps/.png/.ps images.
      - id: install_deps
        run: |
          dnf -y update
          dnf -y install autoconf automake bzip2 git git-lfs lilypond make xz
          # The checkout is owned by a different uid than the container runs
          # as, which makes git refuse to operate on it ("dubious ownership").
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v2
        with:
          lfs: true

      - id: configure
        run: |
          autoreconf --install
          ./configure

      - id: make_dist
        run: |
          make dist

      - id: make
        run: |
          make
